name: Build HyperBilibili Pen

on:
  push:
    branches:
      - master
      - "ui/**"
      - "debug/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperbili-pen-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-build:
    needs: native-credential
    name: Falcon app package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Build native credential store (host compile check)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          make -C native CC=gcc

      - name: Install aiot-cli
        run: npm install --global aiot-vue-cli@1.0.32

      - name: Install project dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Check project
        run: npm run check

      - name: Download ARMv7 native credential JSAPI
        uses: actions/download-artifact@v4
        with:
          name: hyperbili-native-credential-armv7
          path: libs

      - name: Build production AMR
        run: npm run build:prod

      - name: Upload AMR package
        uses: actions/upload-artifact@v4
        with:
          name: hyperbili-pen-amr
          path: "*.amr"
          if-no-files-found: error
          retention-days: 14

  native-credential:
    name: ARMv7 native credential vault
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-linux-gnueabihf make perl python3 python3-pip curl file
          python3 -m pip install --break-system-packages ziglang==0.17.1

      - name: Build native credential JSAPI
        run: |
          bash native/build-credential-armv7.sh
          file libs/libjsapi_hypercredential.so
          readelf -h libs/libjsapi_hypercredential.so | grep -E 'Class:|Machine:'

      - name: Upload native credential JSAPI
        uses: actions/upload-artifact@v4
        with:
          name: hyperbili-native-credential-armv7
          path: libs/libjsapi_hypercredential.so
          if-no-files-found: error
          retention-days: 14
